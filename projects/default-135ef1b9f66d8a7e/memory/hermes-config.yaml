# Hermes 配置快照（脱敏精简版，自动生成）
# 生成方式：hermes_cli.config.load_config() -> _strip_default_values() -> YAML
# 机器路径泛化为 %USERPROFILE% / %LOCALAPPDATA% / %APPDATA%；凭据一律 key_env 引用。

model:
  default: muse-spark-1.3-contributor-free
  provider: opencode-free
  base_url: ''
  key_env: HERMES_CUSTOM_WORKBUDDY2API_API_KEY
providers:
  radeon-cloud:
    name: AMD
    base_url: https://developer.amd.com.cn/radeon/api/v1
    model: Qwen3.8-Flash-Next
    discover_models: false
    models:
      DeepSeek-V4-Flash: {}
      DeepSeek-V4-Flash-Vision-Exp: {}
      MiniCPM5-2B: {}
      Qwen3.8-Flash-Next: {}
    key_env: HERMES_CUSTOM_RADEON_CLOUD_API_KEY
  cpa:
    name: CPA
    base_url: http://127.0.0.1:18080/v1
    model: gemini-3.8-flash-high
    discover_models: false
    models:
      gemini-3.8-flash-high: {}
      gemini-pro-agent: {}
      gemini-3.1-pro-low: {}
      gemini-3.1-flash-lite: {}
      claude-sonnet-4-6: {}
      gemini-3.6-flash-high: {}
      gemini-3-flash: {}
      gemini-3.1-flash-image: {}
      gpt-oss-120b-medium: {}
      claude-opus-4-6-thinking: {}
      gemini-3.7-flash-high: {}
    key_env: HERMES_CUSTOM_CPA_API_KEY
  workbuddy2api:
    name: workbuddy2api
    base_url: http://127.0.0.1:8787/v1
    model: deepseek-v4.1-flash
    discover_models: false
    models:
      auto: {}
      gpt-6-astra: {}
      gpt-5.6-sol: {}
      gpt-5.6-terra: {}
      gpt-5.6-luna: {}
      gpt-5.5: {}
      gpt-5.4: {}
      gpt-5.3-codex: {}
      gemini-3.5-flash: {}
      hy4-preview: {}
      hy4-preview-x: {}
      hy3-x: {}
      glm-5.3: {}
      glm-5.3-flash: {}
      glm-5.2: {}
      glm-5.1: {}
      glm-5.0: {}
      glm-5v-turbo: {}
      glm-4.7: {}
      glm-4.6: {}
      glm-4.6v: {}
      minimax-m3: {}
      minimax-m2.5: {}
      kimi-k3-1: {}
      kimi-k2.7: {}
      kimi-k2.6: {}
      kimi-k2.5: {}
      kimi-k2-thinking: {}
      deepseek-v4.1-flash: {}
      deepseek-v4-pro: {}
      deepseek-v4-flash: {}
      deepseek-v3-2-volc: {}
      hunyuan-2.0-thinking: {}
      hunyuan-chat: {}
      default: {}
      default-model: {}
      fast-model: {}
      balanced-model: {}
      primary-model: {}
      deep-model: {}
      hy4-preview-f: {}
    key_env: HERMES_CUSTOM_WORKBUDDY2API_API_KEY
agent:
  max_turns: 500
  verbose: false
  reasoning_effort: ultra
  personalities: {}
terminal:
  lifetime_seconds: 300
web:
  backend: exa
  search_backend: exa
  extract_backend: exa
browser:
  allow_private_urls: true
auxiliary:
  background_review:
    enabled: false
display:
  resume_last_session: false
  streaming: true
  show_cost: true
  language: zh
  cleanup_progress: false
  in_app_tips: false
  in_app_tours: false
stt:
  enabled: false
  echo_transcripts: false
voice:
  beep_volume: 1
memory:
  memory_char_limit: 4000
  user_char_limit: 3000
  nudge_interval: 0
moa:
  presets:
    default:
      enabled: false
      reference_models:
      - provider: openrouter
        model: deepseek/deepseek-v4-pro
        enabled: false
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
  - provider: openrouter
    model: deepseek/deepseek-v4-pro
    enabled: false
  aggregator:
    provider: openrouter
    model: anthropic/claude-opus-4.8
  degraded_reference_policy: loud
  fanout: user_turn
  enabled: false
skills:
  creation_nudge_interval: 0
curator:
  enabled: false
approvals:
  mode: 'off'
plugins:
  enabled:
  - config-guard
  - token-stats
  disabled: []
security:
  allow_private_urls: true
  allow_data_training_tiers_noninteractive: true
  protected_instruction_files: false
code_execution:
  timeout: 300
  max_tool_calls: 50
onboarding:
  seen:
    busy_input_prompt: true
telemetry:
  shared_metrics:
    offer_version: 2
updates:
  pre_update_backup: false
computer_use:
  backend: cua
_config_version: 50
group_sessions_per_user: true
platform_toolsets:
  cli:
  - clarify
  - code_execution
  - computer_use
  - cronjob
  - delegation
  - file
  - image_gen
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - video
  - vision
  - web
  telegram:
  - hermes-telegram
  discord:
  - hermes-discord
  whatsapp:
  - hermes-whatsapp
  slack:
  - hermes-slack
  signal:
  - hermes-signal
  qqbot:
  - hermes-qqbot
  yuanbao:
  - hermes-yuanbao
  teams:
  - hermes-teams
  google_chat:
  - hermes-google_chat
  homeassistant:
  - hermes-homeassistant
mcp_servers:
  chrome-devtools:
    command: cmd
    args:
    - /c
    - npx
    - -y
    - chrome-devtools-mcp@1.9.0
    - --autoConnect
    - --ignore-default-chrome-arg=--disable-extensions
    timeout: 300
    enabled: true
    lazy: true
    idle_timeout_seconds: 60
  deepwiki:
    url: https://mcp.deepwiki.com/mcp
    enabled: true
known_builtin_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - file
  - homeassistant
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - spotify
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
known_plugin_toolsets:
  cli:
  - a2a
  - spotify
model_aliases:
  workbuddy:
    model: auto
    provider: custom
    base_url: http://127.0.0.1:8787/v1
  workbuddy-glm:
    model: glm-5.2
    provider: custom
    base_url: http://127.0.0.1:8787/v1
  workbuddy-glm53:
    model: glm-5.3-flash
    provider: custom
    base_url: http://127.0.0.1:8787/v1
  workbuddy-kimi:
    model: kimi-k2.7
    provider: custom
    base_url: http://127.0.0.1:8787/v1
  workbuddy-kimi3:
    model: kimi-k3
    provider: custom
    base_url: http://127.0.0.1:8787/v1
  workbuddy-deepseek:
    model: deepseek-v4-pro
    provider: custom
    base_url: http://127.0.0.1:8787/v1
  workbuddy-hy4:
    model: hy4-preview
    provider: custom
    base_url: http://127.0.0.1:8787/v1
video_gen:
  provider: openrouter
platforms:
  webhook:
    enabled: true
