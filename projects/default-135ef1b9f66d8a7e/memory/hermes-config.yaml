fallback_providers: []
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  service_tier: ''
  fast_auto_seconds: 60
  verbose: false
  reasoning_effort: ultra
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: exa
  search_backend: exa
  extract_backend: exa
browser:
  inactivity_timeout: 120
  allow_private_urls: true
  use_real_profile: false
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 35
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  hygiene_max_turn_hold_seconds: 10
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: auto
    model: ''
  background_review:
    enabled: false
display:
  compact: true
  busy_input_mode: interrupt
  bell_on_complete: true
  bell_on_prompt: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  show_cost: true
  skin: default
  language: zh
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  message_reactions: false
stt:
  enabled: false
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
  provider: local
voice:
  auto_tts: false
  beep_volume: 1
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 3000
  user_char_limit: 2000
  nudge_interval: 0
  provider: openviking
  openviking:
    endpoint: http://127.0.0.1:1933
    account: default
    user: default
    agent: hermes
    recall_limit: 3
    recall_score_threshold: 0.35
    recall_prefer_abstract: true
    recall_resources: true
    recall_timeout_seconds: 15
delegation:
  max_iterations: 250
moa:
  presets:
    default:
      reference_models:
      - provider: codebuddy
        model: glm-5.3-flash
        enabled: false
      aggregator:
        provider: codebuddy
        model: deepseek-v4.1-flash
      enabled: false
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
  - provider: codebuddy
    model: glm-5.3-flash
    enabled: false
  aggregator:
    provider: codebuddy
    model: deepseek-v4.1-flash
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: false
skills:
  creation_nudge_interval: 0
  disabled: []
curator:
  enabled: false
approvals:
  mode: 'off'
plugins:
  enabled:
  - superpowers
  - token-stats
  - config-guard
  disabled: []
  entries:
    superpowers:
      allow_tool_override: false
security:
  allow_private_urls: true
  allow_data_training_tiers_noninteractive: true
  protected_instruction_files: false
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: true
onboarding:
  seen:
    busy_input_prompt: true
telemetry:
  shared_metrics:
    enabled: false
    send: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
computer_use:
  backend: cua
local_runtime:
  enabled: false
_config_version: 42
mcp_servers:
  chrome-devtools:
    command: cmd
    args:
    - /c
    - npx
    - -y
    - chrome-devtools-mcp@1.9.0
    - --autoConnect
    - --ignore-default-chrome-arg=--disable-extensions
    timeout: 300
    enabled: true
    lazy: true
    idle_timeout_seconds: 60
  deepwiki:
    url: https://mcp.deepwiki.com/mcp
    enabled: true
  ekko-studio-api:
    command: <EKKO_STUDIO_HOME>\ekko-studio.exe
    args:
    - <EKKO_STUDIO_HOME>\resources\webui\bin\ekko-studio-mcp.mjs
    - api
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: '%USERPROFILE%\.hermes-web-ui'
      HERMES_WEBUI_STATE_DIR: '%USERPROFILE%\.hermes-web-ui'
      HERMES_WEB_UI_PROFILE: default
      HERMES_MCP_SERVER_NAME: ekko-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  ekko-studio-browser:
    command: <EKKO_STUDIO_HOME>\ekko-studio.exe
    args:
    - <EKKO_STUDIO_HOME>\resources\webui\bin\ekko-studio-mcp.mjs
    - browser
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: '%USERPROFILE%\.hermes-web-ui'
      HERMES_WEBUI_STATE_DIR: '%USERPROFILE%\.hermes-web-ui'
      HERMES_WEB_UI_PROFILE: default
      HERMES_MCP_SERVER_NAME: ekko-studio-browser
      HERMES_MCP_TOOLSET: browser
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  ekko-studio-devices:
    command: <EKKO_STUDIO_HOME>\ekko-studio.exe
    args:
    - <EKKO_STUDIO_HOME>\resources\webui\bin\ekko-studio-mcp.mjs
    - devices
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: '%USERPROFILE%\.hermes-web-ui'
      HERMES_WEBUI_STATE_DIR: '%USERPROFILE%\.hermes-web-ui'
      HERMES_WEB_UI_PROFILE: default
      HERMES_MCP_SERVER_NAME: ekko-studio-devices
      HERMES_MCP_TOOLSET: devices
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  ekko-studio-use:
    command: <EKKO_STUDIO_HOME>\ekko-studio.exe
    args:
    - <EKKO_STUDIO_HOME>\resources\webui\bin\ekko-studio-mcp.mjs
    - use
    timeout: 1860
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: '%USERPROFILE%\.hermes-web-ui'
      HERMES_WEBUI_STATE_DIR: '%USERPROFILE%\.hermes-web-ui'
      HERMES_WEB_UI_PROFILE: default
      HERMES_MCP_SERVER_NAME: ekko-studio-use
      HERMES_MCP_TOOLSET: use
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
